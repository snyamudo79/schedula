<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Schedula mark: a stopwatch (ring, gap, crown dot) holding a check — time, handled. -->
  <defs>
    <linearGradient id="sch-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213d"/><stop offset="1" stop-color="#070b16"/></linearGradient>
    <radialGradient id="sch-glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#7aa2ff" stop-opacity=".28"/><stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sch-mark" gradientUnits="userSpaceOnUse" x1="12" y1="9" x2="52" y2="49"><stop offset="0" stop-color="#9dbbff"/><stop offset="1" stop-color="#b196ff"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#sch-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#sch-glow)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <path d="M39.2 13.4A20 20 0 1 1 24.8 13.4" fill="none" stroke="url(#sch-mark)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="11.6" r="2.9" fill="url(#sch-mark)"/>
  <path d="M23.8 33.2 29.8 39.2 41.6 27.4" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
